[package]
name = "harnesswurm-desktop"
version = "0.1.0"
description = "Tauri desktop app for Harnesswurm telemetry"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/einfachllm/harnesswurm"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
harnesswurm-backend = { path = "../../harnesswurm/backend" }


