# Cost estimates for the analytics dashboard.
#
# Prices are USD per 1,000,000 tokens. This is a small STARTER set, not an
# authoritative price list — verify against your provider's current pricing
# page and edit the numbers (or add/remove models) to match what you
# actually use. A model with no entry here (or missing input/output prices)
# simply shows no cost estimate instead of a guessed one.
#
# cache_write_per_million / cache_read_per_million are optional; when
# omitted, cached tokens are costed at the regular input price.
models:
  - name: "gpt-4o"
    provider: "openai"
    input_per_million: 2.50
    cache_read_per_million: 1.25
    output_per_million: 10.00

  - name: "gpt-4o-mini"
    provider: "openai"
    input_per_million: 0.15
    cache_read_per_million: 0.075
    output_per_million: 0.60

  - name: "gpt-3.5-turbo"
    provider: "openai"
    input_per_million: 0.50
    output_per_million: 1.50

  - name: "claude-opus-4-5"
    provider: "anthropic"
    input_per_million: 5.00
    cache_write_per_million: 6.25
    cache_read_per_million: 0.50
    output_per_million: 25.00

  - name: "claude-sonnet-4-5"
    provider: "anthropic"
    input_per_million: 3.00
    cache_write_per_million: 3.75
    cache_read_per_million: 0.30
    output_per_million: 15.00

  - name: "claude-haiku-4-5"
    provider: "anthropic"
    input_per_million: 1.00
    cache_write_per_million: 1.25
    cache_read_per_million: 0.10
    output_per_million: 5.00
