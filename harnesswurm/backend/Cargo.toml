[package]
name = "harnesswurm-backend"
version = "0.1.0"
edition = "2021"
description = "Local proxy that records coding-agent LLM traffic — tokens, cache, tool calls, cost and live status"
license = "Apache-2.0"
repository = "https://github.com/einfachllm/harnesswurm"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde_yaml = "0.9.34"
sha2 = "0.10"

[[bin]]
name = "harnesswurm-backend"
path = "src/main.rs"

[[bin]]
name = "harnesswurm"
path = "src/bin/harnesswurm.rs"
